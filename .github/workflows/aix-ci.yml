name: AIX CI

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  aix-ci:
    name: AIX CI
    runs-on:
      - codebuild-usfs-${{ github.run_id }}-${{ github.run_attempt }}
      - buildspec-override:true

    steps:
      - uses: actions/checkout@v4

      - name: Run AIX tests
        shell: bash
        env:
          AIX_HOST: ${{ secrets.AIX_HOST }}
          AIX_PORT: ${{ secrets.AIX_PORT }}
          AIX_USER: ${{ secrets.AIX_USER }}
          AIX_SSH_OPTIONS: ${{ secrets.AIX_SSH_OPTIONS }}
        run: bash tests/ci/aix-ci.sh
