name: AIX Tests

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on:
      - codebuild-usfs-${{ github.run_id }}-${{ github.run_attempt }}
      - buildspec-override:true
    env:
      AIX_HOST: ${{ secrets.AIX_HOST }}
      AIX_PORT: ${{ secrets.AIX_PORT }}
      AIX_USER: ${{ secrets.AIX_USER }}
      AIX_SSH_OPTIONS: ${{ secrets.AIX_SSH_OPTIONS }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run ordinary and end-to-end tests
        shell: bash
        run: bash tests/ci/run-aix-tests.sh
